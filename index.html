<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bull Ring — FPL</title>
  <meta name="theme-color" content="#3D1620">

  <link rel="icon" type="image/svg+xml" href="assets/bull.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,100..900&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-bull" aria-hidden="true"></div>

  <header class="masthead">
    <div class="band">
      <img class="bull" src="assets/bull.svg" alt="" width="72" height="72">
      <div class="wordmark">
        <h1>BULL RING</h1>
        <p class="season" id="season">2026/27</p>
      </div>
    </div>
    <div class="hero" id="hero"><!-- three money figures, count up --></div>
  </header>

  <nav class="tabbar" role="tablist" aria-label="Views">
    <button class="tab" role="tab" data-view="overall">Table</button>
    <button class="tab" role="tab" data-view="monthly">Month</button>
    <button class="tab" role="tab" data-view="prizes">Money</button>
    <button class="tab" role="tab" data-view="grid">GWs</button>
    <button class="tab tab-info" role="tab" data-view="rules" aria-label="Rules">ⓘ</button>
  </nav>

  <main id="main" aria-live="polite">
    <p class="state">Loading…</p>
  </main>

  <footer class="colophon">
    <span id="last-updated"></span>
  </footer>

  <div class="grain" aria-hidden="true"></div>
  <script src="app.js"></script>
</body>
</html>
